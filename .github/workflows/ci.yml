name: ci

# Gate for merging into main: everything here must pass on the PR head.
# Mirrors .pre-commit-config.yaml plus the real test/build steps that pre-commit
# cannot run (pytest needs the api/ dependency set, bicep needs the compiler).
# Deploys are separate — see teardown.yml and docs/PLAN.md § Cost & safety.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR supersedes the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & formatting (pre-commit)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      # Pinned literally, not via .python-version: that file is git-ignored,
      # so it does not exist on the runner.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      # --all-files is the deliberate CI baseline; locally the hooks run on
      # staged files only (see AGENTS.md).
      - name: Run pre-commit on all files
        uses: pre-commit/action@v3.0.1

  test:
    name: Tests (api)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install dependencies
        working-directory: api
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Tests import `main` via a sys.path insert, so pytest runs from api/.
      - name: Run pytest
        working-directory: api
        run: pytest -q

  infra:
    name: IaC build (bicep)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      # Installs the standalone bicep binary, not `az bicep`: the azure/CLI
      # action requires an inlineScript input and runs in a container,
      # which is the wrong shape for a build-only check.
      - name: Install Bicep CLI
        env:
          # Bump deliberately; keep in step with the bicep version installed by
          # the local `az bicep` used in the bicep-format pre-commit hook.
          BICEP_VERSION: v0.48.1
        run: |
          set -euo pipefail
          echo "Using bicep $BICEP_VERSION"
          # Into ~/.local/bin, not /usr/local/bin: the runner user cannot
          # write there.
          mkdir -p ~/.local/bin
          curl -fsSL -o ~/.local/bin/bicep \
            "https://github.com/Azure/bicep/releases/download/$BICEP_VERSION/bicep-linux-x64"
          chmod +x ~/.local/bin/bicep
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          bicep --version

      # The build itself lives in scripts/validate-bicep.sh, so local and CI
      # validate identically: it compiles every infra/**/*.bicep AND
      # *.bicepparam (which this inline loop previously skipped, because
      # `bicep build` rejects .bicepparam) with `--stdout`, so no .json lands
      # next to the sources, and fails with one annotation per bad file.
      #
      # BICEP_MODE=bicep is deliberate: the script prefers `az bicep`, and
      # GitHub-hosted runners *do* have `az` -- but its bundled Bicep version
      # moves under us, while the version pinned above is what the local
      # bicep-format hook is kept in step with. Pin it here; the format check
      # below uses the same binary.
      - name: Build every bicep file
        env:
          BICEP_MODE: bicep
        run: ./scripts/validate-bicep.sh

      # Matches the bicep-format local hook in .pre-commit-config.yaml: Space
      # indent, size 2, final newline. Formats a copy of the whole tree so
      # module paths still resolve, then diffs, so a failure shows the exact
      # change instead of silently rewriting the repo. Covers .bicep and
      # .bicepparam alike (keep the find patterns in sync with the hook).
      - name: Check bicep formatting
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          cp -r infra "$tmp/infra"
          while IFS= read -r file; do
            bicep format "$file" --outfile "$file" \
              --indent-kind Space --indent-size 2 --insert-final-newline
          done < <(find "$tmp/infra" \( -name '*.bicep' -o -name '*.bicepparam' \) | sort)
          diff -ru infra "$tmp/infra"

  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      # Syntax errors in a script only surface at run time, so fail on those.
      - name: bash -n
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            echo "::group::bash -n $file"
            bash -n "$file"
            echo "::endgroup::"
          done < <(find scripts -name '*.sh' | sort)

      # A gate, not advice. common.sh and the `_`-prefixed helpers are sourced
      # rather than run, so they declare `# shellcheck shell=bash` instead of
      # carrying a shebang. The scripts that do run split `export X="$(...)"`
      # into a separate assignment (SC2155 masks a failed command's exit
      # status). No exclusions either way.
      - name: shellcheck
        run: |
          set -euo pipefail
          shellcheck --severity=warning scripts/*.sh

      # Emits through every printer and every command-log helper on both logging
      # backends (no az, no .env), then asserts what the console streams, the
      # three log files and the workflow summary each have to contain. The split
      # is easy to break silently — an `info` that stops reaching a log, an
      # unbalanced ::group::, an `exit` where a `return` belonged — and none of
      # that shows up anywhere else until a failed run needs reading. The step
      # summary it verifies is the one a reviewer reads first, so it is worth
      # gating. See the script header for the full list of what is covered.
      - name: Logging self-check
        run: ./scripts/check-logging.sh

      # scripts/_log.sh picks one of two interchangeable logging backends at
      # source time. A printer that exists in only one of them type-checks fine
      # and then blows up at run time on the other platform, so the two
      # `name() {` definition lists must stay identical. Private helpers
      # (_gh_*) are deliberately excluded: they are backend-internal.
      - name: Logging backends define the same functions
        run: |
          set -euo pipefail
          fns() { grep -oE '^[a-z][a-z0-9_]*\(\)' "$1" | sort -u; }
          if ! diff <(fns scripts/_log-local.sh) <(fns scripts/_log-ghactions.sh); then
            echo "::error::scripts/_log-local.sh and scripts/_log-ghactions.sh define different functions."
            exit 1
          fi

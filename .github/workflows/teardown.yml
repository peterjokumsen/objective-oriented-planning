name: teardown

# Nightly cost control, not a development convenience.
#
# The meter runs whether or not anyone is looking at the repo, so this workflow
# exists permanently and must never be deleted, disabled or commented out when a
# phase ends, a deploy breaks, or the project goes quiet. Its entire value is
# that it fires when nobody is watching.
#
# ARMED as of Phase 1. Each step calls scripts/teardown.sh --precheck /
# --purge-vault / --verify rather than inlining `az group delete`: the script
# holds the pre-check, the ordering and the verification, and a raw delete here
# would have none of them. Do not inline one.
#
# Setup -- the app registration, RBAC, federated credential and GitHub
# environment -- is documented in docs/CI_TEARDOWN.md.
#
# Design rationale: docs/PLAN.md § Cost & safety.
on:
  # 03:17 UTC rather than 03:00 -- GitHub's scheduled workflows queue on the
  # hour, and the top of the hour is the slowest slot to start.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      environment_name:
        description: Override the environment to tear down (defaults to the repo variable).
        required: false
        type: string
      purge_vault:
        description: Purge the soft-deleted Key Vault so the next same-name deploy can proceed.
        required: false
        default: true
        type: boolean
      delete_shared:
        description: Also delete the shared resource group (ACR + App Configuration). Ignored when the SHARED_LOCK repo variable is true.
        required: false
        default: false
        type: boolean
      dry_run:
        description: Show what would be deleted, change nothing in Azure.
        required: false
        default: false
        type: boolean

# `id-token: write` is what makes OIDC possible. There is no stored client
# secret anywhere in this repo -- the credential is scoped to the `azure`
# environment below, so a fork or an outside PR cannot mint a token.
permissions:
  contents: read
  id-token: write

# One teardown per environment, and never two at once. cancel-in-progress is
# deliberately false: interrupting a half-finished resource-group delete is
# exactly the race that leaves orphaned billable resources.
concurrency:
  group: teardown-${{ inputs.environment_name != '' && inputs.environment_name || vars.ENVIRONMENT }}
  cancel-in-progress: false

jobs:
  teardown:
    name: Tear down environment
    runs-on: ubuntu-latest
    # Must cover the worst case of both waits in teardown.sh: the destroy step
    # waits up to 5 min for the vault to soft-delete (VAULT_PURGE_WAIT_MINUTES
    # below, deliberately short so it cannot eat this budget), then --verify
    # waits up to ~40 min for the group to finish draining. 90 leaves real
    # headroom over that ~45 min; the local default vault wait is 20 min, so
    # raising VAULT_PURGE_WAIT_MINUTES towards it needs this raised too.
    timeout-minutes: 90
    # `azure` here is a GitHub Environment (protection rules + the OIDC federated
    # credential; see docs/CI_TEARDOWN.md) -- not to be confused with the
    # `environment_name` workflow *input*, which is the resource-group name suffix
    # in rg-oop-<environment_name>.
    environment: azure

    env:
      # .env is git-ignored, so the pipeline cannot read these from a file.
      BASE_NAME: ${{ vars.BASE_NAME }}
      LOCATION: ${{ vars.LOCATION }}
      ENVIRONMENT: ${{ inputs.environment_name != '' && inputs.environment_name || vars.ENVIRONMENT }}
      # scripts/common.sh requires SUBSCRIPTION_ID (the .env name), not the
      # AZURE_-prefixed secret name. azure/login below reads the secret directly
      # via the `with:` block, so it does not depend on this variable.
      SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      # Pinned literally, not via .python-version: that file is git-ignored and
      # so does not exist on the runner.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Log in to Azure (OIDC, no client secret)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Read-only. Publishes needs_teardown so the destructive step can be
      # skipped. Almost every nightly run takes the "nothing to tear down" branch,
      # which is the point: the common case must cost nothing. A dry run stops
      # here and reports instead.
      - name: Cheap pre-check
        id: precheck
        if: inputs.dry_run != true
        run: ./scripts/teardown.sh --precheck

      # Order matters -- rg-oop-<env> first, rg-oop-shared only with --shared.
      # Reversed, a running container app can try to pull images mid-teardown.
      # Nightly runs purge the vault; local runs keep --purge-vault opt-in
      # because resource-group deletion is async and the vault may not be
      # soft-deleted yet.
      - name: Destroy the environment resource group
        if: steps.precheck.outputs.needs_teardown == 'true' && inputs.dry_run != true
        env:
          # teardown.sh waits this long for the vault to surface as
          # soft-deleted after `group delete --no-wait`. Short on purpose: the
          # Verify step owns the long wait (it is already polling the group),
          # and this must not eat into the job's timeout budget. Do not raise it
          # towards the ~20 min default without raising timeout-minutes too.
          VAULT_PURGE_WAIT_MINUTES: "5"
        run: |
          set -euo pipefail
          flags=()
          if [[ "${{ inputs.purge_vault }}" == "true" ]]; then
            flags+=(--purge-vault)
          fi
          # The shared RG (ACR + App Configuration) survives teardown by default:
          # it is subscription-scoped and expensive to recreate. Delete it only
          # when a manual run asks for it, or when SHARED_LOCK is not "true".
          # Inputs are empty strings on the schedule trigger, not "false".
          if [[ "${{ inputs.delete_shared }}" == "true" ]]; then
            flags+=(--shared)
          elif [[ "${{ vars.SHARED_LOCK }}" != "true" ]]; then
            flags+=(--shared)
          fi
          ./scripts/teardown.sh "${flags[@]}"

      - name: Nothing to tear down
        if: steps.precheck.outputs.needs_teardown != 'true' && inputs.dry_run != true
        run: echo "rg-oop-${{ env.ENVIRONMENT }} is absent and no vault is soft-deleted; skipping the destructive step."

      - name: Show what would be deleted (dry run)
        if: inputs.dry_run == true
        run: |
          set -euo pipefail
          echo "DRY RUN — nothing below is executed."
          echo "Resource group:     rg-${{ env.BASE_NAME }}-${{ env.ENVIRONMENT }}"
          echo "Key Vault purge:    ${{ inputs.purge_vault }}"
          echo "Shared RG deletion: ${{ inputs.delete_shared || vars.SHARED_LOCK != 'true' }}"
          echo "Re-run without the dry_run input to apply."

      # Re-check that rg-oop-<env> is gone and the vault is no longer
      # soft-deleted. A silent partial teardown is the failure mode worth
      # catching, because the cost it leaks is invisible until the next billing
      # statement. teardown.sh polls ~40 min for the RG (the Container Apps
      # managed environment is slow to drain) and reports what is left to drain
      # through `check-state.sh --rg`, so timeout-minutes must exceed the poll.
      - name: Verify
        if: steps.precheck.outputs.needs_teardown == 'true' && inputs.dry_run != true
        run: ./scripts/teardown.sh --verify

      # The three log files written by init_command_log (command traces, stdout,
      # stderr) hold what the console deliberately hides: stderr from the
      # existence probes, and command output consumed by a $(...) capture.
      # `if: always()` so a red run is still diagnosable after the runner is
      # discarded; ignored on a dry run, which runs no scripts and so writes
      # none. Short retention: these are per-nightly debug artifacts, not
      # something to keep.
      - name: Upload script logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: script-logs-${{ env.ENVIRONMENT }}
          path: logs/
          if-no-files-found: ignore
          retention-days: 7
